<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Gestion du CSS -->
    <link
      rel="stylesheet"
      href="./node_modules/@fortawesome/fontawesome-free/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Document</title>
  </head>
  <body>

    <!-- ENTETE de PAGE -->
    <header id="entete">
      <div class="container">
        <div id="logo">
          <a href="#">Mboa <span>Market</span></a>
        </div>
        <div id="menu">
          <a href="#" id="btn_panier">
            Panier <span><i class="fa-solid fa-cart-shopping"></i></span>
            <span id="nb_articles" class="hide">0</span>
          </a>
        </div>
      </div>
    </header>

    <!-- CONTENEUR DE LA PAGE -->

    <main id="conteneur">

      <!-- SECTION CARROUSEL -->
      <section id="carrousel">
        
      </section>
      <!-- SECTION BOUTIQUE -->
      <section id="boutique">
        <div class="boutique_entete">
          <h2>Nos Produits du marché</h2>
          <p id="nb_resultats"></p>
        </div>

        <!--Filtre de recherche de produits-->
        <div class="boutique_outils">
          <div class = "recherche">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="search" id="recherche" placeholder="Rechercher : poivre blanc, poulet..." />
          </div>

          <select id="tri">
            <option value="default">Trier par : recommandés</option>
            <option value="prix_croissant">Prix croissant</option>
            <option value="prix_decroissant">Prix décroissant</option>
            <option value="nom">Nom (A -> Z)</option>
          </select>
        </div>

        <!-- Liste des catégories -->
        <div id = "categories"></div>

        <!-- Liste des produits -->
        <div id="produits"></div>
      </section>
    </main>

    <!-- PIED DE PAGE -->
     <footer id="pied">
      <p><b>Mboa<span>Market</span></b>Le goût de ça, livré chez vous.</p>
      <p>Tél : 655504397 | Email : mboa@gmail.com</p>
      <p>Copyright &copy; 2026 Mboa Market</p>
    </footer>

    <!--FENETRE MODAL PANIER-->
    <div id="modal_commande" class="hide">
      <div class="modal_container">
        <span id="modal_fermer">
          <i class="fa-solid fa-xmark"></i>
        </span>

        <form id="modal_form" method="post" action="#">
          <fieldset class="commande_info">
            <legend>Finaliser ma commande</legend>

            <!--Nom-->
            <div class="champ"> 
              <label for="nom">Nom complet</label>
              <input type="text" id="nom" name="nom" placeholder="Entrez votre nom"/>
            </div>

            <!--Téléphone-->
            <div class="champ"> 
              <label for="telephone">Téléphone Mobile</label>
              <input type="tel" id="telephone" name="telephone" placeholder="Entrez votre numéro de téléphone"/>
            </div>

            <!--Ville-->
            <div class="champ"> 
              <label for="ville">Ville de livraison</label>
              <select name="ville" id="ville">
                <option value="DOUALA">DOUALA</option>
                <option value="YAOUNDE">YAOUNDE</option>
                <option value="BERTOUA">BERTOUA</option>
              </select>
            </div>

            <!--Mode de paiement-->
            <div class="champ"> 
              <label for="paiement">Moyen de paiement</label>
              <select name="paiement" id="paiement">
                <option value="Orange Money">Orange Money</option>
                <option value="MTN Mobile Money">MTN Mobile Money</option>
              </select>
            </div>
          </fieldset>

          <fieldset class="commande_produit">
            <legend>Récapitulatif de la commande</legend>

            <!--Tableau des produits-->
            <table border="0" cellpadding = "4" cellspacing = "8">
              <thead>
                <tr>
                  <th>Produit</th>
                  <th>PU (FCFA)</th>
                  <th>QTE</th>
                  <th>MONTANT (FCFA)</th>
                  <th>Options</th>
                </tr>
              </thead>
              <tbody id="liste_produits"></tbody>
            </table>

            <div id="total_commande"></div>
            <div class="submit">
              <input type="submit" id="btn_valider" value="Valider la commande">
            </div>
          </fieldset>
        </form>

        <div id="confirmation" class="hide"></div>
      </div>
    </div>

    <!-- Gestion du Javascript -->
    <script type="text/javascript" src="js/carrousel.js"></script>
    <script type="text/javascript" src="js/script.js"></script>
    <script type="text/javascript" src="js/boutique.js"></script>
  </body>
</html>
